services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kinemotion
      POSTGRES_USER: kinemotion
      POSTGRES_PASSWORD: ${KINEMOTION_DB_PASSWORD:?set KINEMOTION_DB_PASSWORD in a .env file}
    volumes:
      - kinemotion-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinemotion -d kinemotion"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: src/KineMotion.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__KineMotion: "Host=postgres;Port=5432;Database=kinemotion;Username=kinemotion;Password=${KINEMOTION_DB_PASSWORD:?set KINEMOTION_DB_PASSWORD in a .env file}"
      Cors__PatientOrigins__0: "http://localhost:8081"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: src/KineMotion.Web/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  kinemotion-postgres-data:
