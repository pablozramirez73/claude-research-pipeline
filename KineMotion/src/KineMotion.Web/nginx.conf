server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Blazor WASM ships .wasm/.dat/.blat with no extension-based content type by default on nginx.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll dat blat task;
    }

    # Same-origin proxy to the Api container, so the WASM client (appsettings.Production.json,
    # ApiBaseUrl=/api-upstream/) never needs its own CORS entry or a public Api hostname.
    location /api-upstream/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
    }

    location /api-upstream/hubs/rehab {
        proxy_pass http://api:8080/hubs/rehab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA fallback: any unmatched path is a client-side Blazor route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
