services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitalface
      POSTGRES_USER: vitalface
      POSTGRES_PASSWORD: ${VITALFACE_DB_PASSWORD:?set VITALFACE_DB_PASSWORD in a .env file}
    volumes:
      - vitalface-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalface -d vitalface"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: src/VitalFace.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=vitalface;Username=vitalface;Password=${VITALFACE_DB_PASSWORD:?set VITALFACE_DB_PASSWORD in a .env file}"
      Cors__KioskOrigins__0: "http://localhost:8081"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: src/VitalFace.Web/Dockerfile
    ports:
      - "8081:8080"
    depends_on:
      - api

volumes:
  vitalface-postgres-data:
