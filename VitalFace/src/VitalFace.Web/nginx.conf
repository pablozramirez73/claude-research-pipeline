server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Blazor WASM ships .wasm/.dat/.blat with no extension-based content type by default on nginx.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll dat blat;
    }

    # Service worker + manifest must never be cached by an intermediary, or offline-mode kiosks
    # get stuck on a stale app shell after a fleet update (see README, deployment/OTA notes).
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path is a client-side Blazor route, not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
